name: Nexus Nightly (Windows portable)

on:
  workflow_dispatch:          # botão "Run workflow"
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 5 * * 1"       # toda segunda, 05:00 UTC

permissions:
  contents: write             # necessário para publicar o release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Baixa o Snes9x 1.60 oficial (com bibliotecas) e aplica a marca Nexus por cima.
      - name: Baixar Snes9x 1.60 e aplicar Nexus
        shell: bash
        run: |
          git clone --depth 1 --branch 1.60 --recurse-submodules --shallow-submodules \
            https://github.com/snes9xgit/snes9x.git src
          cp -r overlay/. src/

      - uses: microsoft/setup-msbuild@v2

      - name: Compilar
        shell: pwsh
        working-directory: src
        run: |
          msbuild win32\snes9xw.sln /t:snes9x /m `
            /p:Configuration="Release Unicode" /p:Platform=x64 `
            /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      # Launcher (biblioteca de jogos com capas): C# compilado com o csc.exe
      # que já vem no Windows, sem instalar nada.
      - name: Compilar launcher (biblioteca)
        shell: pwsh
        run: |
          if (-not (Test-Path launcher\Program.cs)) { throw "A pasta 'launcher' (com o Program.cs) não está no repositório. Envie-a por Add file > Upload files." }
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /codepage:65001 /target:winexe /optimize+ /out:Nexus-launcher.exe `
            /win32icon:src\win32\rsrc\icon1.ico `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            launcher\Program.cs
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar o launcher" }

      - name: Montar pacote portátil
        shell: pwsh
        working-directory: src
        run: |
          if (-not (Test-Path win32\nexus-x64.exe)) { throw "nexus-x64.exe não foi gerado" }
          if (-not (Test-Path ..\Nexus-launcher.exe)) { throw "Nexus-launcher.exe não foi gerado" }
          New-Item -ItemType Directory -Force Nexus | Out-Null
          Copy-Item ..\Nexus-launcher.exe Nexus\Nexus.exe
          Copy-Item win32\nexus-x64.exe Nexus\NexusCore.exe
          Copy-Item LICENSE Nexus\
          Copy-Item data\cheats.bml Nexus\
          Copy-Item NEXUS_README.md Nexus\LEIA-ME.md
          Compress-Archive -Path Nexus -DestinationPath ..\Nexus-portable-win64.zip

      # Instalador (Inno Setup): instala por usuário, cria atalhos e desinstalador.
      - name: Criar instalador
        shell: pwsh
        run: |
          if (-not (Test-Path installer\nexus.iss)) { throw "A pasta 'installer' (com o nexus.iss) não está no repositório. Envie-a por Add file > Upload files." }
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup não foi instalado" }
          & $iscc /Qp "/DStage=$PWD\src\Nexus" "/DIcon=$PWD\src\win32\rsrc\icon1.ico" "/DOutDir=$PWD" installer\nexus.iss
          if ($LASTEXITCODE -ne 0) { throw "falha ao criar o instalador" }
          if (-not (Test-Path Nexus-Setup.exe)) { throw "Nexus-Setup.exe não foi gerado" }

      - name: Publicar release "nightly"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly Nexus-Setup.exe Nexus-portable-win64.zip \
            --prerelease --title "Nexus Nightly" \
            --notes "Build automático do Nexus (baseado no Snes9x 1.60). Baixe o Nexus-Setup.exe e instale (ou use o .zip portátil). Gerado em $(date -u +'%Y-%m-%d %H:%M UTC')."
